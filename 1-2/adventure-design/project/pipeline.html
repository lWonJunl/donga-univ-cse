<style>
:root{color-scheme:light;--ink:#19364b;--muted:#536d7a;--paper:#edf4f5;--surface:#fff;--line:#c5d8dd;--accent:#086b78;--code:#172c3d}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Pretendard,"Noto Sans KR","Malgun Gothic",sans-serif;line-height:1.7;letter-spacing:-.02em}
header{background:#d7eceb;border-bottom:1px solid #a9cbcd;padding:18px 28px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}header h1{font-size:23px;margin:0}header p{margin:2px 0 0;color:var(--muted);font-size:14px}
main{max-width:1800px;margin:auto;padding:20px 24px;display:grid;grid-template-columns:235px 315px minmax(0,1fr);gap:18px;align-items:start}
h2{margin:0 0 6px;font-size:17px}h3{margin:18px 0 6px;font-size:15px}.hint{margin:0 0 12px;color:var(--muted);font-size:13px}
.flow{list-style:none;padding:0;margin:0}.flow li{position:relative;padding:0 0 12px 17px;border-left:2px solid #8cb9bb;margin-left:6px}.flow li:last-child{border-left-color:transparent}.flow li:before{content:"";position:absolute;left:-6px;top:17px;width:10px;height:10px;border-radius:50%;background:var(--accent)}
.flow li:last-child:after{content:"";position:absolute;left:-2px;top:0;height:17px;border-left:2px solid #8cb9bb}
button{font:inherit;cursor:pointer}.step{width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);padding:9px 11px;color:var(--ink);border-radius:5px}.step strong{display:block;font-size:14px}.step small{display:block;color:var(--muted);font-size:12px}.step[aria-pressed="true"]{border-color:var(--accent);background:#d9eeed;box-shadow:inset 4px 0 var(--accent)}
.detail,.viewer{min-width:0;background:var(--surface);border:1px solid var(--line);padding:17px;border-radius:5px}.toolbar{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}.upload{font-size:13px;color:var(--muted)}.upload input{max-width:240px}
.functions{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 15px}.functions button{border:1px solid var(--line);background:#f1f7f7;color:var(--ink);padding:5px 9px;border-radius:4px;font-size:13px}.functions button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:white}
.process{list-style:none;counter-reset:process;margin:12px 0 0;padding:0}.process li{counter-increment:process;position:relative;margin-left:12px;padding:0 0 13px 20px;border-left:2px solid #b4d5d2}.process li:last-child{border-left-color:transparent}.process li:before{content:counter(process);position:absolute;left:-12px;top:3px;background:#dbeeed;color:#15515a;border-radius:50%;width:22px;height:22px;text-align:center;font-size:12px;font-weight:bold}.process button{border:0;background:transparent;color:var(--ink);text-align:left;padding:1px 4px;font-size:14px}.process button[aria-current="step"]{background:#d9eeed;color:#075c65;font-weight:bold}.process small{display:block;color:var(--muted);margin-left:4px;font:12px Consolas,monospace}
.codebox{background:var(--code);color:#e3edf0;overflow:auto;height:calc(100vh - 250px);min-height:360px;border-radius:4px;padding:16px}pre{font:14px/1.7 "Cascadia Mono",Consolas,"Malgun Gothic",monospace;letter-spacing:normal;margin:0;min-width:max-content}.num{color:#91a8af;user-select:none}.kw{color:#f6c788}.str{color:#b4dda1}.comment{color:#a4c5b6}button:focus-visible,input:focus-visible{outline:3px solid #be7400;outline-offset:3px}
.process li:last-child:after{content:"";position:absolute;left:-2px;top:0;height:14px;border-left:2px solid #b4d5d2}
@media(max-width:1100px){main{grid-template-columns:220px minmax(0,1fr)}.viewer{grid-column:1/-1}.codebox{height:55vh}}
@media(max-width:650px){main{grid-template-columns:1fr;padding:14px}.viewer{grid-column:auto}.codebox{height:55vh;min-height:280px}header{padding:15px}}

<header><div><h1>약속ZIP 실행 흐름</h1><p>메뉴 → 처리 단계 → 함수 코드를 따라가세요.</p></div><label class="upload">최신 main.c 불러오기 <input id="file" type="file" accept=".c,text/plain"></label></header>

<section aria-labelledby="flow-title"><h2 id="flow-title">메뉴와 실행 순서</h2><p class="hint">항목을 선택하면 오른쪽에 관련 함수가 나타납니다.</p><ol class="flow" id="flow"></ol></section>
<section class="detail" aria-labelledby="detail-title"><h2 id="detail-title">처리 순서</h2><p class="hint" id="description"></p><p class="hint">단계를 누르면 해당 함수가 열립니다.</p><ol class="process" id="process"></ol></section>
<section class="viewer" aria-labelledby="view-title"><div class="toolbar"><div><h2 id="view-title">함수 코드</h2><p class="hint" id="status">HTML에 포함된 작성 시점의 main.c</p></div><strong id="current-function"></strong></div><div class="functions" id="functions" aria-label="함수 선택"></div><div class="codebox" id="codebox"><pre id="code" aria-live="polite"></pre></div></section>
</main>
<script id="embedded-source" type="application/json">"/*\n    작성자 : 최원준\n    최초 작성일 : 2026.11.16.\n    최종 작성일 : 2026.11.27.\n    개발 환경 : Visual Studio Code 1.147\n    컴파일러 : GCC 16.2.0 (MinGW-w64 / WinLibs UCRT 64-bit)\n    문법 표준 : C11\n    소스 인코딩 : UTF-8\n*/\n\n#define _CRT_SECURE_NO_WARNINGS\n#include <stdio.h>\n#include <string.h>\n#include <ctype.h>\n#include <stdlib.h>\n\n/* ---------- 상수 정의 ---------- */\n#define MAX_PEOPLE 8                /* 최대 참가자 수 */\n#define DAYS_PER_WEEK 7             /* 요일 수 (요일 이름 배열과 일치) */\n#define START_HOUR 9                /* 시작 시간 */\n#define END_HOUR 21                 /* 끝 시간 */\n#define TIME_SLOTS_PER_DAY (END_HOUR - START_HOUR) /* 하루에 관리할 1시간 단위 시간대 수 */\n#define NAME_LEN 64                 /* 이름 버퍼 크기 (안내 문구는 63바이트 기준) */\n#define INPUT_LEN 128               /* 한 줄 입력 버퍼 크기 (입력 형식은 128 기준) */\n#define PREFERENCE_SCALE 10         /* 선호도 저장 단위 (소수 입력은 10 기준) */\n#define MAX_CANDIDATES (DAYS_PER_WEEK * TIME_SLOTS_PER_DAY) /* 1시간 약속의 최대 후보 수 */\n#define MAX_RECOMMENDATIONS 3       /* 화면에 표시할 최대 추천 수 */\n\n/* ---------- 구조체 정의 ---------- */\n/* 참가자 한 명의 정보 */\ntypedef struct {\n    int id;                                                  /* 참가자 고유 번호 */\n    int is_registered;                                       /* 등록 여부 (1: 등록, 0: 미등록) */\n    int available[DAYS_PER_WEEK][TIME_SLOTS_PER_DAY];        /* 요일·시간대별 참석 가능 여부 */\n    int preference[DAYS_PER_WEEK][TIME_SLOTS_PER_DAY];       /* 시간대별 선호도 (0.1점 단위) */\n    char name[NAME_LEN];                                     /* 참가자 이름 */\n} participant;\n\n/* 사용자가 선택한 약속 검색 조건 */\ntypedef struct {\n    int duration;            /* 약속 소요 시간 */\n    int min_attendees;       /* 검색에 필요한 최소 참석 인원 */\n} meeting_conditions;\n\n/* 검색된 약속 후보 한 건의 정보 */\ntypedef struct {\n    int day;                         /* 요일 인덱스 */\n    int start_hour;                  /* 약속 시작 시각 */\n    int end_hour;                    /* 약속 종료 시각 */\n    int attendee_count;              /* 참석 가능한 인원 */\n    char attending[MAX_PEOPLE];      /* participants 배열의 같은 인덱스에 해당하는 참석 여부 */\n    float attendance_rate;           /* 전체 참가자 중 참석 비율 */\n    double average_preference;       /* 참석 가능한 참가자의 평균 선호도 */\n} result;\n\n/* ---------- 전역 변수 정의 ---------- */\nconst char *const days[DAYS_PER_WEEK] = {\"월\", \"화\", \"수\", \"목\", \"금\", \"토\", \"일\"};\nint results_valid = 0; /* 현재 참가자와 시간표에 맞는 검색 결과인지 표시 */\nresult results[MAX_CANDIDATES]; /* 검색한 약속 시간 후보 */\nint result_count = 0; /* 저장된 후보 수 */\nint results_active_count = 0; /* 검색 당시 등록된 참가자 수 */\n\n/* ---------- 함수 선언 ---------- */\n/* 메뉴와 주요 기능 */\nint print_menu(void);\nvoid register_participant(participant participants[], int *used_slot_count, int *deleted_participant_count);\nvoid list_participants(participant participants[], int used_slot_count, int deleted_participant_count);\nvoid find_participant(participant participants[], int used_slot_count);\nvoid delete_participant(participant participants[], int used_slot_count, int *deleted_participant_count);\nvoid input_schedule(participant participants[], int count, int is_update);\nvoid update_schedule(participant participants[], int count);\nvoid print_schedule(participant participants[], int count);\nvoid search_times(participant participants[], int count, int active_count);\nvoid print_recommendations(void);\nvoid print_result_details(participant participants[], int count);\n\n/* 입력과 검색·추천을 위한 보조 함수 */\nint read_input_line(char input[INPUT_LEN]);\nint read_name(char name[NAME_LEN]);\nint read_int(int min, int max, int *value);\nint read_preference(int *preference);\nint is_available(const int availability[], int time_slot, int duration);\ndouble calculate_preference(int preference_total, int duration, int attendee_count);\nvoid sort_results(void);\nvoid invalidate_results(void);\n\n/* ---------- 메인 함수 ---------- */\nint main(void) {\n    participant participants[MAX_PEOPLE] = {0};\n    int used_slot_count = 0; /* 한 번이라도 사용한 배열 칸 수 */\n    int deleted_participant_count = 0; /* 사용한 칸 중 현재 비어 있는 칸 수 */\n\n    while (1) {\n        int menu = print_menu();\n        switch (menu) {\n\n        case 1: /* 참가자 등록 */\n            register_participant(participants, &used_slot_count, &deleted_participant_count);\n            break;\n\n        case 2: /* 참가자 목록 조회 */\n            list_participants(participants, used_slot_count, deleted_participant_count);\n            break;\n\n        case 3: /* 참가자 검색 */\n            find_participant(participants, used_slot_count);\n            break;\n\n        case 4: /* 참가자 삭제 */\n            delete_participant(participants, used_slot_count, &deleted_participant_count);\n            break;\n\n        case 5: /* 가능 시간 및 선호도 입력 */\n            if (used_slot_count - deleted_participant_count == 0) {\n                printf(\"[Error] 등록된 참가자가 없습니다.\\n\");\n                break;\n            }\n            input_schedule(participants, used_slot_count, 0);\n            break;\n\n        case 6:  /* 시간표 조회 및 수정 */\n            {    \n                int choice;\n\n                if (used_slot_count - deleted_participant_count == 0) {\n                    printf(\"[Error] 등록된 참가자가 없습니다.\\n\");\n                    break;\n                }\n\n                printf(\"1. 조회  2. 수정 > \");\n                if (!read_int(1, 2, &choice)) {\n                    printf(\"[Error] 1 또는 2를 입력하세요.\\n\");\n                    break;\n                }\n\n                if (choice == 1) {\n                    print_schedule(participants, used_slot_count);\n                } else {\n                    update_schedule(participants, used_slot_count);\n                }\n\n                break;\n            }\n\n        case 7: /* 공통 가능 시간 검색 */\n            search_times(participants, used_slot_count, used_slot_count - deleted_participant_count);\n            break;\n\n        case 8: /* 최적 약속 시간 추천 */\n            print_recommendations();\n            break;\n\n        case 9: /* 추천 결과 상세 조회 */\n            print_result_details(participants, used_slot_count);\n            break;\n\n        case 0: /* 프로그램 종료 */\n            printf(\"프로그램을 종료합니다.\\n\");\n            return 0;\n\n        default: /* 예외 처리 */\n            printf(\"올바른 메뉴 번호를 입력하세요.\\n\");\n            break;\n        }\n    }\n}\n\n/* ---------- 메뉴와 주요 기능 ---------- */\nint print_menu(void) {\n    int choice;\n\n    printf(\"====== 약속ZIP ======\\n\");\n    printf(\"1. 참가자 등록\\n\");\n    printf(\"2. 참가자 목록 조회\\n\");\n    printf(\"3. 참가자 검색\\n\");\n    printf(\"4. 참가자 삭제\\n\");\n    printf(\"5. 가능 시간 및 선호도 입력\\n\");\n    printf(\"6. 시간표 조회 및 수정\\n\");\n    printf(\"7. 공통 가능 시간 검색\\n\");\n    printf(\"8. 최적 약속 시간 추천\\n\");\n    printf(\"9. 추천 결과 상세 조회\\n\");\n    printf(\"0. 종료\\n\");\n    printf(\"선택 > \");\n    if (!read_int(0, 9, &choice)) {\n        /* 입력 종료 또는 오류 시 종료 메뉴로 이동 */\n        if (feof(stdin) || ferror(stdin)) {\n            return 0;\n        }\n        /* 잘못된 메뉴 번호는 main의 default에서 처리 */\n        return -1;\n    }\n\n    return choice;\n}\n\n/* 사용자 등록 */\nvoid register_participant(participant participants[], int *used_slot_count, int *deleted_participant_count) {\n    char name[NAME_LEN];\n    static int next_id = 1;\n    int slot = -1;\n    participant empty = {0};\n\n    if (*used_slot_count - *deleted_participant_count >= MAX_PEOPLE) {\n        printf(\"[Error] 최대 인원 초과\\n\");\n        return;\n    }\n\n    printf(\"등록할 참가자 이름 > \");\n    if (!read_name(name)) {\n        printf(\"[Error] 이름은 공백 없이 63바이트 이하로 입력하세요.\\n\");\n        return;\n    }\n\n    for (int i = 0; i < *used_slot_count; i++) {\n        if (participants[i].is_registered == 1 && strcmp(participants[i].name, name) == 0) {\n            printf(\"[Error] 이미 등록된 이름입니다.\\n\");\n            return;\n        }\n    }\n\n    /* 삭제된 칸 우선 재사용 */\n    for (int i = 0; i < *used_slot_count; i++) {\n        if (participants[i].is_registered == 0) {\n            slot = i;\n            break;\n        }\n    }\n\n    if (slot == -1) {\n        /* 빈 칸이 없을 때 배열 범위 확장 */\n        slot = *used_slot_count;\n        (*used_slot_count)++;\n    } else {\n        (*deleted_participant_count)--;\n    }\n    participants[slot] = empty;\n\n    strcpy(participants[slot].name, name);\n    participants[slot].id = next_id;\n    next_id++;\n    participants[slot].is_registered = 1;\n    invalidate_results();\n\n    printf(\"%s님을 등록했습니다.\\n\", name);\n}\n\n/* 사용자 목록 */\nvoid list_participants(participant participants[], int used_slot_count, int deleted_participant_count) {\n    int active_count = used_slot_count - deleted_participant_count;\n    int last_id = 0;\n\n    printf(\"====== 참가자 목록 (%d명) ======\\n\", active_count);\n    if (active_count == 0) {\n        printf(\"등록된 참가자가 없습니다.\\n\");\n        return;\n    }\n\n    /* 배열 순서와 ID 순서가 다를 수 있음 */\n    for (int number = 1; number <= active_count; number++) {\n        int selected = -1;\n\n        for (int i = 0; i < used_slot_count; i++) {\n            if (participants[i].is_registered == 1 && participants[i].id > last_id) {\n                if (selected == -1 || participants[i].id < participants[selected].id) {\n                    selected = i;\n                }\n            }\n        }\n\n        if (selected == -1) {\n            break;\n        }\n\n        printf(\"%d. %s\\n\", number, participants[selected].name);\n        last_id = participants[selected].id;\n    }\n}\n\n/* 사용자 이름 검색 */\nvoid find_participant(participant participants[], int used_slot_count) {\n    char name[NAME_LEN];\n\n    printf(\"검색할 이름 > \");\n    if (!read_name(name)) {\n        printf(\"[Error] 이름은 공백 없이 63바이트 이하로 입력하세요.\\n\");\n        return;\n    }\n\n    for (int i = 0; i < used_slot_count; i++) {\n        if (participants[i].is_registered == 1 && strcmp(participants[i].name, name) == 0) {\n            printf(\"\\n===== 참가자 검색 결과 =====\\n\");\n            printf(\"참가자 ID : %04d\\n\", participants[i].id);\n            printf(\"참가자 이름 : %s\\n\", participants[i].name);\n            printf(\"등록 상태   : 등록됨\\n\");\n            printf(\"===========================\\n\");\n            return;\n        }\n    }\n\n    printf(\"[Error] '%s'님은 등록되지 않았습니다.\\n\", name);\n}\n\n/* 사용자 삭제 */\nvoid delete_participant(participant participants[], int used_slot_count, int *deleted_participant_count) {\n    char name[NAME_LEN];\n    char input[INPUT_LEN];\n\n    printf(\"삭제할 이름 > \");\n    if (!read_name(name)) {\n        printf(\"[Error] 이름은 공백 없이 63바이트 이하로 입력하세요.\\n\");\n        return;\n    }\n\n    for (int i = 0; i < used_slot_count; i++) {\n        if (participants[i].is_registered == 1 && strcmp(participants[i].name, name) == 0) {\n            printf(\"정말로 삭제하시겠습니까? (Y/N) > \");\n            \n            if (!read_input_line(input) || input[1] != '\\0') {\n                printf(\"[Error] Y 또는 N을 입력하세요.\\n\");\n                return;\n            }\n\n            int is_agree = toupper((unsigned char)input[0]);\n            \n            if (is_agree == 'Y') {\n                int deleted_id = participants[i].id;\n                participant empty = {0};\n                participants[i] = empty;\n                participants[i].id = deleted_id;\n                strcpy(participants[i].name, \"<삭제된 사용자>\");\n                (*deleted_participant_count)++;\n                invalidate_results();\n                printf(\"삭제를 완료하였습니다.\\n\");\n            } else if (is_agree == 'N') {\n                printf(\"사용자 삭제를 취소합니다.\\n\");\n            } else {\n                printf(\"[Error] Y 또는 N을 입력하세요.\\n\");\n            }\n\n            return;\n        }\n    }\n\n    printf(\"[Error] 등록되지 않은 참가자입니다.\\n\");\n}\n\n/* 시간표 입력 */\nvoid input_schedule(participant participants[], int count, int is_update) {\n    char name[NAME_LEN];\n    int day, time_slot, available;\n    int preference = 0;\n\n    printf(\"참가자 이름 > \");\n    if (!read_name(name)) {\n        printf(\"[Error] 이름은 공백 없이 63바이트 이하로 입력하세요.\\n\");\n        return;\n    }\n\n    for (int i = 0; i < count; i++) {\n        if (participants[i].is_registered == 1 && strcmp(participants[i].name, name) == 0) {\n            printf(\"요일 (1: 월 ~ 7: 일) > \");\n            if (!read_int(1, DAYS_PER_WEEK, &day)) {\n                printf(\"[Error] 1~7 사이의 요일을 입력하세요.\\n\");\n                return;\n            }\n\n            printf(\"시작 시간 (%d~%d시) > \", START_HOUR, END_HOUR - 1);\n            if (!read_int(START_HOUR, END_HOUR - 1, &time_slot)) {\n                printf(\"[Error] %d~%d 사이의 시간을 입력하세요.\\n\", START_HOUR, END_HOUR - 1);\n                return;\n            }\n\n            printf(\"참석 가능 여부 (1: 가능, 0: 불가능) > \");\n            if (!read_int(0, 1, &available)) {\n                printf(\"[Error] 0 또는 1을 입력하세요.\\n\");\n                return;\n            }\n\n            if (available == 1) {\n                printf(\"선호도 (1.0~5.0) > \");\n                if (!read_preference(&preference)) {\n                    printf(\"[Error] 1.0~5.0 사이의 선호도를 0.1점 단위로 입력하세요.\\n\");\n                    return;\n                }\n            }\n\n            /* 요일·시각을 배열 인덱스로 변환 */\n            participants[i].available[day - 1][time_slot - START_HOUR] = available;\n            participants[i].preference[day - 1][time_slot - START_HOUR] = preference;\n\n            invalidate_results();\n\n            if (is_update == 1) {\n                printf(\"%s요일 %02d:00~%02d:00 시간표를 수정했습니다.\\n\", days[day - 1], time_slot, time_slot + 1);\n            } else {\n                printf(\"%s요일 %02d:00~%02d:00 시간표를 저장했습니다.\\n\", days[day - 1], time_slot, time_slot + 1);\n            }\n\n            return;\n        }\n    }\n\n    printf(\"[Error] '%s'님은 등록되지 않았습니다.\\n\", name);\n}\n\n/* 시간표 수정 */\nvoid update_schedule(participant participants[], int count) {\n    printf(\"수정할 시간표를 입력하세요.\\n\");\n    input_schedule(participants, count, 1);\n}\n\n/* 시간표 조회 */\nvoid print_schedule(participant participants[], int count) {\n    char name[NAME_LEN];\n\n    printf(\"참가자 이름 > \");\n    if (!read_name(name)) {\n     /* 종료 시간을 넘지 않는 시작 시간만 검사 */\n        for (int time_slot = 0; time_slot <= TIME_SLOTS_PER_DAY - conditions.duration; time_slot++) {\n            result candidate = {0};\n            int preference_total = 0;\n\n            for (int i = 0; i < count; i++) {\n                candidate.attending[i] = 'N';\n                if (participants[i].is_registered == 1 && is_available(participants[i].available[day], time_slot, conditions.duration)) {\n                    candidate.attendee_count++;\n                    candidate.attending[i] = 'Y';\n\n                    for (int hour = 0; hour < conditions.duration; hour++) {\n                        preference_total += participants[i].preference[day][time_slot + hour];\n                    }\n                }\n            }\n\n            if (candidate.attendee_count >= conditions.min_attendees) {\n                /* 최대 후보 수 안에서 결과 저장 */\n                candidate.day = day;\n                candidate.start_hour = START_HOUR + time_slot;\n                candidate.end_hour = candidate.start_hour + conditions.duration;\n                candidate.attendance_rate = 100.0f * candidate.attendee_count / active_count;\n                candidate.average_preference = calculate_preference(preference_total, conditions.duration, candidate.attendee_count);\n                results[result_count] = candidate;\n                result_count++;\n\n                printf(\"%s요일 %02d:00~%02d:00  참석 가능: %d명\\n\", days[day], candidate.start_hour, candidate.end_hour, candidate.attendee_count);\n            }\n        }\n    }\n\n    if (result_count == 0) {\n        printf(\"조건에 맞는 시간이 없습니다.\\n\");\n    }\n\n    sort_results(); /* 추천 순서로 정렬 */\n}\n\n/* 저장된 검색 결과 중 설정한 개수만큼 표시 */\nvoid print_recommendations(void) {\n    if (!results_valid) {\n        printf(\"먼저 공통 가능 시간을 검색하세요.\\n\");\n        return;\n    }\n\n    if (result_count == 0) {\n        printf(\"추천할 시간이 없습니다.\\n\");\n        return;\n    }\n\n    printf(\"=== 추천 결과 ===\\n\");\n\n     const lines=source.replace(/\r\n/g,'\n').split('\n'), found=[];
    lines.forEach((line,i)=>{const m=line.match(/^(?:int|void|double)\s+([a-z_]+)\s*\([^;]*\)\s*\{/);if(m)found.push({name:m[1],start:i});});
    return found.map(item=>{const end=lines.findIndex((line,i)=>i>item.start&&/^\}/.test(line));return {...item,end:end<0?lines.length:end+1,lines};});
  }
  function highlight(line){
    const fragment=document.createDocumentFragment(), pattern=/(\/\*.*?\*\/|\/\/.*|"(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*'|\b(?:int|void|char|double|float|const|static|if|else|for|while|return|break|switch|case|default|sizeof)\b)/g;
    let cursor=0, match;
    while((match=pattern.exec(line))){fragment.append(document.createTextNode(line.slice(cursor,match.index)));const span=document.createElement('span');span.className=match[0].startsWith('/*')||match[0].startsWith('//')?'comment':/^["']/.test(match[0])?'str':'kw';span.textContent=match[0];fragment.append(span);cursor=pattern.lastIndex;}
    fragment.append(document.createTextNode(line.slice(cursor)));return fragment;
  }
  function showCode(name){
    selectedFunction=name;const fn=definitions().find(x=>x.name===name);code.replaceChildren();
    document.getElementById('current-function').textContent=name+'()';
    document.getElementById('codebox').scrollTop=0;
    if(!fn){code.textContent='함수를 찾지 못했습니다. main.c 파일을 확인하세요.';return;}
    fn.lines.slice(fn.start,fn.end).forEach((line,i)=>{const n=document.createElement('span');n.className='num';n.textContent=String(fn.start+i+1).padStart(4,' ')+'  ';code.append(n,highlight(line),document.createTextNode('\n'));});
    functions.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b.textContent===name)));
  }
  function showStep(index){
    selectedStep=index;const step=steps[index];description.textContent=step.detail;functions.replaceChildren();
    const process=document.getElementById('process');process.replaceChildren();
    step.process.forEach(([label,name])=>{const li=document.createElement('li'),b=document.createElement('button'),hint=document.createElement('small');b.type='button';b.textContent=label;hint.textContent=name+'()';b.addEventListener('click',()=>{process.querySelectorAll('button').forEach(item=>item.removeAttribute('aria-current'));b.setAttribute('aria-current','step');showCode(name);});li.append(b,hint);process.append(li);});
    flow.querySelectorAll('button').forEach((b,i)=>b.setAttribute('aria-pressed',String(i===index)));
    step.functions.forEach(name=>{const b=document.createElement('button');b.type='button';b.textContent=name;b.addEventListener('click',()=>showCode(name));functions.append(b);});showCode(step.functions[0]);
  }
  steps.forEach((step,i)=>{const li=document.createElement('li'),b=document.createElement('button'),title=document.createElement('strong'),detail=document.createElement('small');b.className='step';b.type='button';title.textContent=step.title;detail.textContent=step.detail;b.append(title,detail);b.addEventListener('click',()=>showStep(i));li.append(b);flow.append(li);});
  document.getElementById('file').addEventListener('change',async e=>{const file=e.target.files[0];if(!file)return;try{source=await file.text();status.textContent=file.name+'을 불러왔습니다.';showStep(selectedStep);}catch{status.textContent='파일을 읽지 못했습니다. 다시 선택하세요.';}});
  showStep(0);
})();
</script>
